[package]
name = "sotto-desktop"
version = "0.1.0"
description = "Sotto desktop shell"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "sotto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[features]
# Replaces the real core with a scripted session, for UI work without keys or a sidecar.
demo = []

[dependencies]
sotto-protocol.workspace = true
sotto-core = { path = "../../../crates/sotto-core" }
getrandom = "0.3"
# Native file panel (NSOpenPanel on macOS) opened from Rust, so the webview needs no dialog permission.
rfd = { version = "=0.17.2", default-features = false }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSScreen", "NSResponder", "NSView", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSURL"] }

[lints]
workspace = true
