[workspace]
resolver = "3"
members = ["crates/sotto-protocol", "crates/sotto-detect", "crates/sotto-core", "crates/sotto-rag", "apps/desktop/src-tauri"]
exclude = ["services/api"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }
sotto-protocol = { path = "crates/sotto-protocol" }
sotto-detect = { path = "crates/sotto-detect" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
