[package]
name = "sotto-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
sotto-protocol.workspace = true
sotto-detect.workspace = true
sotto-rag = { path = "../sotto-rag" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"
getrandom = "0.3"
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "std"] }
bytes = "1"
toml = "0.8"
keyring = "4"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
command-fds = { version = "0.3.3", features = ["tokio"] }

[dev-dependencies]
sotto-rag = { path = "../sotto-rag", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
